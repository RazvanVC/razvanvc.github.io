experiences:
  title: Experiencia profesional
  info:
    - role: Senior Consultant · Tech Lead — Full Stack & Data Platforms
      time: ene 2025 - Actualidad
      company: NFQ Consulting · Madrid (Híbrido)
      details: |
        Llevo dos engagements en paralelo: **Intrum**, donde desarrollo, y
        **Banco Santander**, donde doy soporte y formación al equipo de Atoti.

          - **Intrum — Proyecto Fénix:** trabajo en real estate y servicios
            financieros, construyendo y manteniendo procesos batch que mueven
            volúmenes grandes. El día a día es **Spring Boot**, **Spring Batch** y
            **MySQL**, y los problemas más interesantes suelen ser de
            **idempotencia**, recovery y rendimiento. Cuando toca, gestiono
            migraciones de esquema con **Liquibase** y hago refactors del modelo
            relacional para mantener la consistencia.
          - **Banco Santander — Soporte y enablement en Atoti:** el equipo del
            cliente desarrolla sobre **Atoti** (Java & Python SDK) para reporting de **riesgo de
            mercado bajo IMA/FRTB**. Mi rol es de soporte técnico continuo —
            resuelvo dudas del SDK, desbloqueo casos complejos y traduzco
            necesidades funcionales a patrones de modelado de cubos.
          - **Programa formativo ActiveViam/Atoti:** diseñé y entregué un programa
            de **10 sesiones** sobre el Java & Python SDK — modelado de cubos, joins,
            agregaciones, postprocessors, formatos — dirigido a perfiles cross-team.

        En lo transversal hago lo que se espera de un Tech Lead: defino criterios
        de arquitectura, reviso PRs y marco el roadmap técnico; mentorizo a juniors
        y mid; escribo la documentación que de verdad reduce el tiempo de onboarding
        y los incidentes — ADRs, modelado de dominio, especificaciones — e
        interlocuto directamente con cliente en planning ágil.

    - role: Engineer · Full Stack Developer
      time: jun 2023 - ene 2025
      company: NTT DATA Europe & Latam · Madrid (Remoto)
      details: |
        Etapa senior dentro de NTT DATA, con responsabilidad técnica creciente en
        proyectos de banca — arquitectura de cubos, lead de migraciones y mentoring.

          - **Banco Santander:** lideré técnicamente la migración de plataforma
            **ActivePivot 3.6 → 6 (Java SDK)**, con construcción de cubos OLAP — **PnL**,
            **VaR** — y dashboards para mesas de tesorería, integrados con motores
            de cálculo y orígenes batch.
          - **Banco BBVA:** reporting en **Atoti (Python SDK)** para áreas de mercados —
            **XVA** y **PnL** —, con diseño de arquitectura de cubos y toma de
            requisitos con cliente final.
          - **Mentoring e I+D+i:** acompañamiento a perfiles junior, code review y
            participación en iniciativas internas de innovación y prototipado.

    - role: Junior Engineer · Full Stack
      time: feb 2022 - jun 2023
      company: NTT DATA Europe & Latam · Madrid
      details: |
        Etapa de consolidación: desarrollo full stack con creciente autonomía en
        proyectos de banca, con foco en plataformas de datos y producto digital.

          - **Banc Sabadell:** plataforma de recomendación de inversión —
            validaciones, normalización de datos e integraciones con sistemas
            internos del banco. Toma de requisitos funcionales con cliente y
            entrega de funcionalidades end-to-end.
          - **Banco Santander:** contribución al desarrollo de cubos OLAP y
            dashboards dentro del equipo de plataforma analítica del cliente.
          - **Buenas prácticas:** adopción de PRs, testing y revisión cruzada con
            perfiles senior. Refinamiento de patrones de diseño en Java/Spring y
            de componentes en React.

    - role: Student · Contrato de prácticas
      time: may 2021 - ene 2022
      company: NTT DATA Europe & Latam · Madrid
      details: |
        Primeras prácticas con incorporación a proyectos reales de cliente desde
        el primer mes. Onboarding intensivo en stack bancario — primeras
        contribuciones a desarrollos full stack en **Java/Spring** y **React** bajo
        supervisión de perfiles senior, aprendizaje del ecosistema de plataformas
        analíticas usadas en banca (ActivePivot/Atoti) y adopción de buenas
        prácticas de Git, testing y revisión de código en equipos de consultoría.

    - role: Android Developer · Proyecto de investigación
      time: feb 2020 - abr 2021
      company: Universidad de Alcalá · Alcalá de Henares
      details: |
        Desarrollo end-to-end de una aplicación **Android nativa (Java)** para
        captura de datos en un estudio científico de comportamiento de aves: toma
        de requisitos con el equipo de investigación, diseño, desarrollo, puesta
        en producción y soporte. Sincronización offline-first y exportación de
        datasets para análisis posterior.

projects:
