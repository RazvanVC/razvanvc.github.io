experiences:
  title: Experiencia profesional
  info:
    - role: Senior Consultant · Tech Lead — Full Stack & Data Platforms
      time: ene 2025 - Actualidad
      company: NFQ Consulting · Madrid (Híbrido)
      details: |
        Referente técnico para dos clientes estratégicos en paralelo: **Banco Santander**
        (plataforma analítica ActiveViam) e **Intrum** (real estate / servicios
        financieros). Combino arquitectura, desarrollo y liderazgo técnico.

          - **Automatización de procesos a gran escala (Intrum):** diseño y desarrollo
            de pipelines **Spring Boot / Spring Batch** sobre **MySQL** para campañas
            masivas — planificación, segmentación, **idempotencia**, recovery y
            optimización de consultas. Migraciones versionadas con **Liquibase** y
            refactors de modelo relacional para garantizar consistencia y rendimiento.
          - **Plataforma analítica ActiveViam / Atoti (Santander):** diseño y evolución
            de cubos OLAP, modelos de datos y dashboards de reporting financiero.
            Integración con orígenes batch.
          - **Liderazgo técnico:** definición de criterios de arquitectura, code review,
            mentoring de juniors y diseño de un **programa formativo de 10 sesiones**
            sobre ActiveViam/Atoti dirigido a perfiles cross-team.
          - **Modelado de dominio y documentación técnica:** especificaciones
            funcionales, ADRs y arquitectura de información para reducir el tiempo de
            onboarding y minimizar incidentes en producción.
          - Interlocución directa con cliente, planning ágil y entregas incrementales.

    - role: Software Engineer · Full Stack Web Developer
      time: may 2021 - ene 2025
      company: NTT DATA · Madrid
      details: |
        Proyectos en **banca** orientados a plataformas de datos, reporting regulatorio
        y producto digital. Stack principal: **Java/Spring**, **React**, **ActiveViam**.

          - **Banco Santander:** lideré técnicamente la migración de plataforma
            **ActivePivot 3.6 → 6**, construcción de cubos (**PnL**, **VaR**) y
            dashboards para mesas de tesorería.
          - **Banco BBVA:** reporting en **Atoti** (**XVA**, **PnL**), diseño de
            arquitectura de cubos y toma de requisitos con cliente final.
          - **Banc Sabadell:** solución de recomendación de inversión — validaciones,
            normalización de datos e integraciones con sistemas internos.
          - **I+D+i:** participación en iniciativas de innovación, prototipado y
            mentoring técnico a perfiles junior en onboarding.

    - role: Android Developer (proyecto de investigación)
      time: feb 2020 - abr 2021
      company: Universidad de Alcalá · Alcalá de Henares
      details: |
        Desarrollo end-to-end de una aplicación **Android nativa (Java)** para captura
        de datos en un estudio científico de comportamiento de aves.

          - Toma de requisitos con el equipo de investigación, diseño, desarrollo,
            puesta en producción y soporte.
          - Sincronización offline-first y exportación de datasets para análisis posterior.

projects:
  title: Proyectos destacados
  intro: >
    Selección de proyectos relevantes — combinación de arquitectura, automatización
    a escala, plataformas de datos y producto SaaS personal.
  assignments:
    - title: Automatización de procesos masivos · Spring Batch + MySQL
      link:
      tagline: >
        Diseño e implementación de pipelines batch para procesamiento masivo en cliente
        de real estate: planificación, segmentación, idempotencia, recovery y
        rendimiento. Migraciones versionadas con <strong>Liquibase</strong>, refactors
        de modelo relacional y optimización de consultas SQL.

    - title: Plataforma ActiveViam / Atoti — Banca (Santander, BBVA)
      link:
      tagline: >
        Migración ActivePivot 3.6 → 6, modelado de cubos OLAP
        (<strong>PnL, VaR, XVA</strong>), dashboards y conectores batch para
        reporting financiero regulatorio.

    - title: Programa formativo ActiveViam/Atoti (Tech Lead)
      link:
      tagline: >
        Diseño curricular y entrega de <strong>10 sesiones</strong> sobre el SDK de
        Atoti (modelado de cubos, joins, agregaciones, postprocessors, formatos),
        dirigido a perfiles cross-team. Materiales reutilizables y trazabilidad de
        aprendizaje.

    - title: CitaBOT — SaaS de automatización de citas (proyecto personal)
      link: https://github.com/razvanvc
      tagline: >
        SaaS multi-tenant para automatización de citas y recordatorios. Stack:
        <strong>TypeScript</strong>, <strong>Node.js/Fastify</strong>,
        <strong>PostgreSQL</strong>, <strong>monorepo pnpm + Turborepo</strong>,
        <strong>arquitectura hexagonal</strong>, <strong>feature flags</strong>,
        integración con <strong>Stripe</strong> y proveedores externos. Despliegue
        en <strong>Fly.io</strong> con Docker multi-stage. ADRs y especificaciones
        versionadas.

    - title: Plataforma de recomendación de inversión (Banc Sabadell)
      link:
      tagline: >
        Validaciones, normalización de datos e integraciones del motor de
        recomendación para el área de inversión.

