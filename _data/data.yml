career-profile:
  title: Perfil profesional
  summary: |
    **Tech Lead / Solution Architect** con +6 años entregando soluciones end-to-end
    para clientes de **banca** (Santander, BBVA, Sabadell) y **real estate / servicios
    financieros** (Intrum). Combino perfil técnico **full stack** (Java/Spring, React/
    TypeScript, SQL) con responsabilidad de **arquitectura**, **liderazgo de equipo**
    e **interlocución directa con cliente**.

    Especializado en **automatización de procesos de negocio a gran escala**: diseño
    e implementación de pipelines batch, orquestación de flujos masivos, gobernanza de
    datos y plataformas analíticas. Stack principal **Spring Boot / Spring Batch**,
    **MySQL/PostgreSQL** y **ActiveViam (Atoti/Python)**, con foco en rendimiento, idempotencia
    y mantenibilidad.

    Como **referente técnico** defino criterios de arquitectura, lidero refactors críticos
    (modelado relacional, idempotencia, performance), reviso PRs y formo equipo. He
    diseñado y entregado un **programa formativo de 10 sesiones sobre ActiveViam/Atoti**
    dirigido a perfiles cross-team.

