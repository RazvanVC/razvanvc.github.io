<!DOCTYPE html>
<html lang="es">
{% include head.html %}
<body class="ats-mode">
  <div class="ats-controls d-print-none">
    <button type="button" onclick="window.print()" class="ats-btn">
      <i class="fas fa-print"></i> Imprimir
    </button>
    <a href="{{ site.baseurl }}/" class="ats-btn ats-btn-secondary">
      <i class="fas fa-arrow-left"></i> Volver
    </a>
  </div>

  <main class="ats-document">
    {{ content }}
  </main>

  <script>
    if (location.hash === '#print') {
      window.addEventListener('load', function () {
        setTimeout(function () { window.print(); }, 350);
      });
    }
  </script>
</body>
</html>
